<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Football Shorts Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0c12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    header {
      text-align: center;
      padding: 32px 0 24px;
    }
    header h1 {
      font-size: 2rem;
      color: #ffd700;
      letter-spacing: 1px;
    }
    header p { color: #aaa; margin-top: 6px; font-size: 0.95rem; }

    .card {
      background: #161820;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: #ffd700;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input[type=text], select, textarea {
      width: 100%;
      background: #0d0f18;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      padding: 12px 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    input[type=text]:focus, select:focus, textarea:focus {
      border-color: #ffd700;
    }
    textarea { resize: vertical; min-height: 110px; }

    select option { background: #161820; }

    .templates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tpl-btn {
      background: #0d0f18;
      border: 2px solid #2a2d3a;
      border-radius: 10px;
      color: #ccc;
      cursor: pointer;
      font-size: 0.88rem;
      padding: 12px 8px;
      text-align: center;
      transition: all .2s;
    }
    .tpl-btn:hover { border-color: #ffd700; color: #ffd700; }
    .tpl-btn.active { border-color: #ffd700; color: #ffd700; background: #1a1c00; }
    .tpl-btn .icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }

    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      border: none;
      border-radius: 12px;
      color: #000;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px;
      transition: opacity .2s, transform .1s;
      letter-spacing: 0.5px;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:active { transform: scale(0.98); }
    .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

    /* progress */
    #progress-box {
      display: none;
      background: #161820;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    #progress-box h3 { color: #ffd700; margin-bottom: 12px; font-size: 1rem; }

    .bar-track {
      background: #0d0f18;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .bar-fill {
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      height: 100%;
      border-radius: 8px;
      width: 0%;
      transition: width .4s;
      animation: pulse-bar 2s infinite;
    }
    @keyframes pulse-bar {
      0%,100% { opacity:1; } 50% { opacity:.7; }
    }

    #log-box {
      background: #0d0f18;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #9dff9d;
      max-height: 200px;
      overflow-y: auto;
      padding: 12px;
    }
    #log-box .line { margin-bottom: 3px; word-break: break-word; }
    #log-box .line.err { color: #ff6b6b; }

    /* download */
    #download-box {
      display: none;
      text-align: center;
      background: #0d1a0d;
      border: 1px solid #2d5a2d;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
    }
    #download-box h3 { color: #4cff4c; font-size: 1.1rem; margin-bottom: 6px; }
    #download-box p { color: #aaa; font-size: 0.9rem; margin-bottom: 18px; }
    .btn-download {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 32px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-new {
      background: transparent;
      border: 1px solid #ffd700;
      border-radius: 12px;
      color: #ffd700;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 12px;
      padding: 14px 20px;
    }

    /* error */
    #error-box {
      display: none;
      background: #1a0d0d;
      border: 1px solid #5a2d2d;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      color: #ff8888;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      color: #444;
      font-size: 0.8rem;
      padding: 20px 0 32px;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>⚽ Football Shorts</h1>
    <p>Plak YouTube-links en genereer automatisch een short</p>
  </header>

  <!-- Formulier -->
  <div class="card" id="form-card">

    <label>Template</label>
    <div class="templates" id="templates">
      <button class="tpl-btn active" data-val="skill_move">
        <span class="icon">🎯</span>Skills compilatie
      </button>
      <button class="tpl-btn" data-val="goal_celebration">
        <span class="icon">⚽</span>Doelpunt viering
      </button>
      <button class="tpl-btn" data-val="match_highlights">
        <span class="icon">🏟️</span>Match highlights
      </button>
      <button class="tpl-btn" data-val="save_of_the_day">
        <span class="icon">🧤</span>Keeper redding
      </button>
      <button class="tpl-btn" data-val="player_spotlight">
        <span class="icon">👑</span>Speler spotlight
      </button>
      <button class="tpl-btn" data-val="top_skills">
        <span class="icon">🔥</span>Top skills
      </button>
    </div>
    <input type="hidden" id="template-val" value="skill_move">

    <label>Speler</label>
    <input type="text" id="player" placeholder="bijv. Michael Olise">

    <label>Club / Competitie</label>
    <input type="text" id="club" placeholder="bijv. Bayern München · Bundesliga">

    <label>Eigen titel (optioneel)</label>
    <input type="text" id="title" placeholder="leeglaten = automatisch">

    <label>YouTube-links <span style="color:#888;font-weight:400;text-transform:none">(één per regel)</span></label>
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>

    <button class="btn-generate" id="btn-gen" onclick="startGenerate()">
      🎬 &nbsp; Genereer Short
    </button>
  </div>

  <!-- Voortgang -->
  <div id="progress-box">
    <h3 id="prog-title">⏳ Bezig met genereren…</h3>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div id="log-box"></div>
  </div>

  <!-- Download -->
  <div id="download-box">
    <h3>✅ Short is klaar!</h3>
    <p>1080×1920 · 9:16 · klaar voor YouTube Shorts</p>
    <a class="btn-download" id="dl-link" href="#">⬇ Download video</a>
    <button class="btn-new" onclick="resetForm()">+ Nieuwe short</button>
  </div>

  <!-- Fout -->
  <div id="error-box" id="error-box">
    <strong>❌ Er ging iets mis:</strong><br>
    <span id="error-msg"></span>
  </div>

  <footer>Football Shorts Generator · Draait lokaal op je computer</footer>
</div>

<script>
  // Template knoppen
  document.querySelectorAll('.tpl-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('template-val').value = btn.dataset.val;
    });
  });

  let pollInterval = null;
  let progValue = 0;

  function startGenerate() {
    const urls = document.getElementById('urls').value.trim();
    if (!urls) { alert('Voer minimaal één YouTube-link in.'); return; }

    const payload = {
      template:  document.getElementById('template-val').value,
      player:    document.getElementById('player').value.trim(),
      club:      document.getElementById('club').value.trim(),
      title:     document.getElementById('title').value.trim(),
      urls:      urls,
    };

    document.getElementById('btn-gen').disabled = true;
    document.getElementById('form-card').style.opacity = '0.5';
    document.getElementById('progress-box').style.display = 'block';
    document.getElementById('download-box').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('log-box').innerHTML = '';
    progValue = 5;
    document.getElementById('bar').style.width = progValue + '%';

    fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
      pollInterval = setInterval(() => pollStatus(data.job_id), 1500);
    });
  }

  function pollStatus(jobId) {
    fetch('/status/' + jobId)
      .then(r => r.json())
      .then(job => {
        // Log bijwerken
        const logBox = document.getElementById('log-box');
        logBox.innerHTML = job.log.map(l =>
          `<div class="line${l.startsWith('✗') ? ' err' : ''}">${escHtml(l)}</div>`
        ).join('');
        logBox.scrollTop = logBox.scrollHeight;

        // Balk animeren
        progValue = Math.min(progValue + 3, job.status === 'klaar' ? 100 : 90);
        document.getElementById('bar').style.width = progValue + '%';

        if (job.status === 'klaar') {
          clearInterval(pollInterval);
          document.getElementById('progress-box').style.display = 'none';
          document.getElementById('download-box').style.display = 'block';
          document.getElementById('dl-link').href = '/download/' + jobId;
          document.getElementById('form-card').style.opacity = '1';
          document.getElementById('btn-gen').disabled = false;
        } else if (job.status === 'fout') {
          clearInterval(pollInterval);
          document.getElementById('progress-box').style.display = 'none';
          document.getElementById('error-box').style.display = 'block';
          document.getElementById('error-msg').textContent = job.error;
          document.getElementById('form-card').style.opacity = '1';
          document.getElementById('btn-gen').disabled = false;
        }
      });
  }

  function resetForm() {
    document.getElementById('download-box').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('urls').value = '';
    document.getElementById('player').value = '';
    document.getElementById('club').value = '';
    document.getElementById('title').value = '';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
