# Football Shorts Generator - Configuratie

output:
  format: mp4
  resolution: "1080x1920"   # 9:16 vertical voor YouTube Shorts
  fps: 30
  max_duration: 59           # YouTube Shorts max 60 seconden
  output_dir: "./output"
  quality: high              # low / medium / high

higgsfield:
  base_url: "https://api.higgsfield.ai"
  default_model: "kling3_0"
  image_model: "nano_banana_pro"
  clip_duration: 5           # Seconden per AI clip

branding:
  channel_name: "FOOTBALL SHORTS"
  watermark: true
  watermark_position: "top-right"  # top-left / top-right / bottom-left / bottom-right
  intro_duration: 2.0
  outro_duration: 2.0

text_style:
  title_font_size: 72
  subtitle_font_size: 48
  player_name_font_size: 60
  primary_color: "#FFFFFF"
  accent_color: "#FFD700"    # Goud
  shadow_color: "#000000"
  stroke_width: 3

effects:
  slow_motion_factor: 0.5    # Voor doelpunten / skills
  zoom_in_scale: 1.15
  transition_duration: 0.3   # Seconden
  flash_effect: true         # Wit flash bij doelpunt

templates:
  goal_celebration:
    clips: 3
    slow_motion: true
    flash: true
    music_style: "epic"
    text_template: "{player} GOAL! {minute}'"

  skill_move:
    clips: 2
    slow_motion: true
    flash: false
    music_style: "hype"
    text_template: "{player} | {skill_name}"

  match_highlights:
    clips: 5
    slow_motion: false
    flash: false
    music_style: "energetic"
    text_template: "{team_a} {score_a}-{score_b} {team_b}"

  player_spotlight:
    clips: 4
    slow_motion: true
    flash: false
    music_style: "cinematic"
    text_template: "{player} | {club}"

  save_of_the_day:
    clips: 2
    slow_motion: true
    flash: true
    music_style: "dramatic"
    text_template: "SAVE! {goalkeeper}"

  top_skills:
    clips: 6
    slow_motion: false
    flash: false
    music_style: "hype"
    text_template: "TOP 5 SKILLS"
