# Football Shorts Generator - Configuratie

output:
  format: mp4
  width: 1080
  height: 1920          # 9:16 vertical voor YouTube Shorts
  fps: 30
  max_duration: 59      # YouTube Shorts max seconden
  output_dir: ./output
  crf: 23               # Videokwaliteit (lager = beter, 18-28)

download:
  quality: "bestvideo[height<=1080]+bestaudio/best[height<=1080]"
  merge_format: mp4
  max_clip_duration: 120  # Download maximaal 120s per clip

branding:
  channel_name: "FOOTBALL SHORTS"   # Naam op je short
  watermark_position: top-left      # top-left / top-right
  intro_duration: 1.5               # Seconden kanaalintro
  outro_duration: 1.5

text:
  title_size: 75
  subtitle_size: 48
  player_size: 60
  primary_color: "#FFFFFF"
  accent_color:  "#FFD700"   # Goud
  shadow_color:  "#000000"
  stroke_width: 3

effects:
  slow_motion_factor: 0.5    # 0.5 = halve snelheid
  zoom_scale: 1.12           # Ken-Burns zoom
  flash_duration: 0.18       # Witte flash bij doelpunt (seconden)
  fade_duration: 0.25        # Fade tussen clips

templates:
  goal_celebration:
    label: "Doelpunt viering"
    clip_trim: 8             # Max seconden per clip
    slow_motion: true
    flash: true
    zoom: true
    music_volume: 0.20
    title: "GOAL! 🔥"
    text_position: bottom    # top / bottom

  skill_move:
    label: "Technische vaardigheid"
    clip_trim: 7
    slow_motion: true
    flash: false
    zoom: true
    music_volume: 0.22
    title: "INSANE SKILL! 😱"
    text_position: bottom

  match_highlights:
    label: "Wedstrijd hoogtepunten"
    clip_trim: 6
    slow_motion: false
    flash: false
    zoom: false
    music_volume: 0.18
    title: "HIGHLIGHTS ⚽"
    text_position: bottom

  player_spotlight:
    label: "Speler spotlight"
    clip_trim: 8
    slow_motion: true
    flash: false
    zoom: true
    music_volume: 0.20
    title: "WORLD CLASS 👑"
    text_position: bottom

  save_of_the_day:
    label: "Keeper redding"
    clip_trim: 7
    slow_motion: true
    flash: true
    zoom: true
    music_volume: 0.22
    title: "IMPOSSIBLE SAVE! 🧤"
    text_position: bottom

  top_skills:
    label: "Skills compilatie"
    clip_trim: 5
    slow_motion: false
    flash: false
    zoom: false
    music_volume: 0.25
    title: "TOP SKILLS 🔥"
    text_position: bottom
